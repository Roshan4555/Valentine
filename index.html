<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at top, #1a001a, #4b004b, #000);
    color: white;
    text-align: center;
    overflow-x: hidden;
}

.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 10;
}

.overlay h2 {
    font-family: 'Great Vibes', cursive;
    font-size: 3em;
}

.container {
    padding: 20px;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 3.5em;
    margin-top: 20px;
}

.photo {
    margin: 20px auto;
    max-width: 90%;
    border-radius: 20px;
    box-shadow: 0 0 40px rgba(255,0,150,0.8);
}

.message {
    max-width: 900px;
    margin: auto;
    font-size: 1.2em;
    line-height: 1.8em;
    padding: 20px;
    display: none;
    white-space: pre-line;
}

button {
    padding: 14px 28px;
    border: none;
    border-radius: 30px;
    background: #ff4da6;
    color: white;
    font-size: 1em;
    cursor: pointer;
    margin: 15px;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    background: #ff1a8c;
}

/* Fireworks */
.firework {
    position: fixed;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    animation: explode 1s ease-out forwards;
}

@keyframes explode {
    to {
        transform: translate(var(--x), var(--y));
        opacity: 0;
    }
}
</style>

    <div id="loveMessage" class="message"></div>
    <button id="yesBtn" style="display:none;" onclick="sayYes()">YES ❤️ Forever</button>
</div>

<script>
const messageText = `My Love,

This Valentine’s Day feels different… deeper, sweeter, more meaningful.
It’s the last one we’ll celebrate as boyfriend and girlfriend.
The next time this day comes around, you’ll be my wife.

We’ve shared laughs, tears, growth, late-night talks, and dreams.
Now that future is right in front of us.

This is our last Valentine’s before forever becomes official.
Before “my girlfriend” turns into “my wife.”

So here’s to our last Valentine’s as two…
And to every Valentine’s after this as one.

Forever yours ❤️
– Roshan`;

function startStory() {
    document.getElementById("introScreen").style.display = "none";
    document.getElementById("bgMusic").play();
    typeMessage();
}

function typeMessage() {
    const container = document.getElementById("loveMessage");
    container.style.display = "block";
    container.innerHTML = "";
    
    let i = 0;
    function typing() {
        if (i < messageText.length) {
            container.innerHTML += messageText.charAt(i);
            i++;
            setTimeout(typing, 40);
        } else {
            document.getElementById("yesBtn").style.display = "inline-block";
        }
    }
    typing();
}

function sayYes() {
    launchFireworks();
    alert("Picture abhi baaki hai mere dost... 💍❤️ Forever begins now!");
}

function launchFireworks() {
    for (let i = 0; i < 120; i++) {
        const firework = document.createElement("div");
        firework.classList.add("firework");
        firework.style.background = "hsl(" + Math.random()*360 + ",100%,50%)";
        firework.style.left = Math.random() * window.innerWidth + "px";
        firework.style.top = Math.random() * window.innerHeight + "px";
        firework.style.setProperty('--x', (Math.random() - 0.5) * 300 + "px");
        firework.style.setProperty('--y', (Math.random() - 0.5) * 300 + "px");
        document.body.appendChild(firework);
        setTimeout(() => { firework.remove(); }, 1000);
    }
}
</script>
